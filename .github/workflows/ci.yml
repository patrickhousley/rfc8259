name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # scripts/shared/color.bash requires a terminal type that supports colors
  TERM: xterm-256color

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: ./main.bash lint

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: ./main.bash format

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - run: ./main.bash test --junit
      - name: Publish test results
        if: ${{ !cancelled() && hashFiles('reports/junit/report.xml') != '' }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: reports/junit/report.xml
          test_files_prefix: tests/
          check_name: Test results
          require_tests: true
          detailed_summary: true
          include_passed: true
      - name: Summarize results
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Tests"
            if [[ -f reports/junit/report.xml ]]; then
              awk -F'"' '/<testsuite /{for(i=1;i<NF;i++){if($i~/ tests=$/)t+=$(i+1); if($i~/ failures=$/)f+=$(i+1)}} END{print t" tests, "f" failures"}' reports/junit/report.xml
            else
              echo "No test report was produced"
            fi
          } >>"${GITHUB_STEP_SUMMARY}"
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: reports/
