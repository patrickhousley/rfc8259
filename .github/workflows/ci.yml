name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # scripts/shared/color.bash requires a terminal type that supports colors
  TERM: xterm-256color

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: ./main.bash lint

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: ./main.bash format

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: ./main.bash test
